<?xml version="1.0" encoding="UTF-8"?>
<!-- Slökkvitæki / Brunahólf logo — light (use on black / dark backgrounds) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" preserveAspectRatio="xMidYMid meet">
  <!-- Solid white disc -->
  <circle cx="110" cy="110" r="92" fill="#fff"/>

  <!-- Black fire-extinguisher silhouette inside the disc -->
  <g fill="#000" transform="translate(110 110)">
    <rect x="-13" y="-66" width="26" height="9" rx="2"/>
    <rect x="-9"  y="-57" width="18" height="10"/>
    <rect x="-22" y="-47" width="44" height="9" rx="2"/>
    <path d="M -28 -38
             Q -28 -42 -24 -42
             L  24 -42
             Q  28 -42 28 -38
             L  28  40
             Q  28  50 18 50
             L -18  50
             Q -28  50 -28  40 Z"/>
    <path d="M 22 -52
             C  46 -52  46 -22  26 -22
             C  10 -22  10  -8  22  -6"
          fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flame mark on the body (signature) -->
    <path d="M -4 -10
             C -10 -2 -10 6 -4 10
             C -2 4 1 4 1 10
             C 4 6 4 0 1 -4
             C -1 -1 -2 -2 -2 -6
             C -3 -8 -3 -10 -4 -10 Z"
          fill="#fff"/>
  </g>

  <!-- Wordmark: Slökkvitæki / Brunahólf -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" fill="#fff" letter-spacing="-1">
    <text x="230" y="100" font-size="64">Slökkvitæki</text>
    <text x="230" y="172" font-size="64">Brunahólf</text>
  </g>
</svg>
